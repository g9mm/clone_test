<!DOCTYPE html>
<html>
<head>
    <title>動画一覧</title>
</head>
<body>
    <h1>動画一覧</h1>
    <a href="/upload">アップロード</a>

    {% for video in videos %}
        <div style="margin-bottom: 30px;">
            <h3>
                <a href="{{ url_for('watch', video_id=video[0]) }}">
                    {{ video[2] or "タイトルなし" }}
                </a>
            </h3>

            <video width="320" controls>
                <source src="{{ url_for('uploaded_file', filename=video[1]) }}" type="video/mp4">
            </video>
        </div>
    {% endfor %}
</body>
</html>
