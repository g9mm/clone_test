<!DOCTYPE html>
<html>
<head>
<title>動画一覧</title>
<style>
body { font-family:sans-serif; }
.grid { display:flex; flex-wrap:wrap; gap:20px; }
.card { width:250px; }
img { width:100%; height:140px; object-fit:cover; }
</style>
</head>
<body>

<h1>動画一覧</h1>
<a href="/upload">投稿</a>

<div class="grid">
{% for v in videos %}
<div class="card">
<a href="/watch/{{v[0]}}">
<img src="/thumb/{{v[4]}}">
</a>
<h4>{{v[2]}}</h4>
<p>{{v[5]}} 回再生</p>
</div>
{% endfor %}
</div>

</body>
</html>
