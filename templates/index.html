<style>
.grid { display:flex; flex-wrap:wrap; gap:20px; }
.card { width:300px; }
img { width:100%; }
</style>

<h1>YouTube風</h1>
<a href="/upload">投稿</a>

<div class="grid">
{% for v in videos %}
<div class="card">
    <a href="/watch/{{v[0]}}">
        <img src="/thumb/{{v[4]}}">
    </a>
    <h4>{{v[2]}}</h4>
    <p>{{v[5]}} 回再生</p>
</div>
{% endfor %}
</div>
