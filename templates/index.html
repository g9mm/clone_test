<!DOCTYPE html>
<html>
<head>
    <title>動画一覧</title>
</head>
<body>
    <h1>動画一覧</h1>
    <a href="/upload">アップロード</a>

    {% for video in videos %}
        <div style="margin-bottom: 30px;">
            <h3>{{ video[2] }}</h3>
            <p>{{ video[3] }}</p>

            <video width="320" controls>
                <source src="{{ url_for('uploaded_file', filename=video[1]) }}" type="video/mp4">
            </video>
        </div>
    {% endfor %}
</body>
</html>
