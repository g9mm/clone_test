<style>
.container { display:flex; }
.main { width:70%; }
.side { width:30%; }
</style>

<div class="container">
<div class="main">
<h2>{{video[2]}}</h2>

<video width="100%" controls autoplay>
    <source src="/uploads/{{video[1]}}">
</video>

<p>{{video[3]}}</p>
<p>{{video[5]}} 回再生</p>

<h3>コメント</h3>
<form method="POST">
<input name="comment">
<button>送信</button>
</form>

{% for c in comments %}
<p>{{c[2]}}</p>
{% endfor %}

</div>

<div class="side">
<h3>関連動画</h3>
{% for r in related %}
<div>
<a href="/watch/{{r[0]}}">
<img src="/thumb/{{r[4]}}" width="120">
{{r[2]}}
</a>
</div>
{% endfor %}
</div>

</div>
