<!DOCTYPE html>
<html>
<head>
    <title>アップロード</title>
</head>
<body>
    <h1>動画アップロード</h1>

    <form method="POST" enctype="multipart/form-data">
        <!-- mp4のみ選択可能 -->
        <input type="file" name="video" accept="video/mp4" required>
        <button type="submit">アップロード</button>
    </form>

    <a href="/">戻る</a>
</body>
</html>
